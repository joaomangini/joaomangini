name: Generate Colored Snake Animation 🐍

on:
  schedule:
    - cron: "0 0 * * *"  # Atualiza todos os dias à meia-noite
  workflow_dispatch:
  push:
    branches:
      - main  # altere para "master" se seu branch principal for assim

jobs:
  build:
    name: Build Colored Snake Animation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Gerar animação Snake personalizada
        uses: Platane/snk@v3
        with:
          github_user_name: joaomangini
          outputs: dist/github-contribution-grid-snake.svg
          # Cores personalizadas da cobra
          color: "#00FFFF"        # Cor do corpo da cobra
          back_color: "#0D1117"   # Fundo do grid (combina com tema escuro do seu README)
          point: "#007FFF"        # Cor dos pontos das contribuições
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar no branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
